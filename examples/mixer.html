<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eido · simplex mixer example</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; --ink: #102135; --paper: #faf5eb; --accent: #007f80; }
    @media (prefers-color-scheme: dark) { :root { --ink: #eef4fc; --paper: #070f19; --accent: #4be4e5; } }
    body { margin: 0; padding: 2rem 1rem; display: grid; gap: 1.25rem; justify-items: center; background: var(--paper); color: var(--ink); }
    h1 { font-weight: 650; letter-spacing: -0.02em; }
    .simplex-pad { width: 15rem; height: 15rem; touch-action: none; }
    .simplex-guide { stroke: color-mix(in srgb, var(--ink) 22%, transparent); stroke-width: .6; }
    .simplex-edge { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .simplex-label { fill: currentColor; font: 0.7rem ui-monospace, monospace; }
    .simplex-spoke { stroke: var(--accent); }
    .simplex-knob { fill: var(--paper); stroke: var(--accent); stroke-width: 3; }
    .card { max-width: 21rem; border: 0.0625rem solid; transition: all .2s; }
    pre { font-size: 0.75rem; max-width: 100%; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Style as a point in space</h1>
  <div id="pad"></div>
  <div class="card" id="card"><strong>Blended card</strong><p>Drag the point. Use arrow keys after focusing the triangle.</p></div>
  <pre id="out"></pre>
  <script type="module">
    import { mountSimplexPad } from "../src/simplex-pad.js";
    import { mixAestheticPresets } from "../src/aesthetic-mixer.js";
    const presets = {
      calm: { rounding: 0.85, density: 0.3, hue: 0.5444, contrast: 0.05 },
      sharp: { rounding: 0.0, density: 0.1, hue: 0.2778, contrast: 0.01 },
      airy: { rounding: 1.0, density: 0.85, hue: 0.8111, contrast: 0.2 },
    };
    const names = Object.keys(presets);
    const card = document.getElementById("card");
    const apply = (w) => {
      const v = mixAestheticPresets(presets, Object.fromEntries(names.map((n, i) => [n, w[i]])));
      card.style.borderRadius = `${v.rounding * 24}px`;
      card.style.padding = `${10 + v.density * 24}px`;
      // Colour in OKLCH, so every hue the point reaches looks equally bright.
      card.style.borderColor = `oklch(0.68 0.13 ${v.hue * 360})`;
      card.style.background = `oklch(0.68 0.13 ${v.hue * 360} / ${0.1 + v.contrast})`;
      document.getElementById("out").textContent = JSON.stringify(v, null, 2);
    };
    mountSimplexPad(document.getElementById("pad"), { labels: names, weights: [0.5, 0.25, 0.25], hues: names.map((n) => presets[n].hue), onChange: apply });
    apply([0.5, 0.25, 0.25]);
  </script>
</body>
</html>
